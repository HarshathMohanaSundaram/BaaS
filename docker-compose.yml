services:
  db:
      image: postgres:16
      environment:
        POSTGRES_USER: bass_user
        POSTGRES_PASSWORD: bass_password
        POSTGRES_DB: baas
      ports:
        - "5432:5432"
      volumes:
        - db_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails server -b 0.0.0.0"
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    environment:
      DATABASE_URL: postgres://bass_user:bass_password@db:5432/baas
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  db_data:
  bundle:
