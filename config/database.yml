# PostgreSQL. Versions 9.5 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USERNAME", "bass_user") %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: baas

test:
  <<: *default
  database: baas_test

production:
  primary: &primary_production
    <<: *default
    database: baas_production
  cache:
    <<: *primary_production
    database: baas_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: baas_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: baas_production_cable
    migrations_paths: db/cable_migrate
